name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guess-pokemon-production
  cancel-in-progress: false

env:
  API_IMAGE_NAME: ghcr.io/xxh3898/guess-pokemon-api
  WEB_IMAGE_NAME: ghcr.io/xxh3898/guess-pokemon-web

jobs:
  validate:
    name: Validate release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  publish:
    name: Publish ARM64 images
    if: github.ref == 'refs/heads/main'
    needs:
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend ARM64 image
        id: publish-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.API_IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=guess-pokemon-api-arm64
          cache-to: type=gha,mode=max,scope=guess-pokemon-api-arm64

      - name: Build and publish frontend ARM64 image
        id: publish-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.WEB_IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=guess-pokemon-web-arm64
          cache-to: type=gha,mode=max,scope=guess-pokemon-web-arm64

      - name: Record published images
        env:
          API_IMAGE_DIGEST: ${{ steps.publish-api.outputs.digest }}
          WEB_IMAGE_DIGEST: ${{ steps.publish-web.outputs.digest }}
        run: |
          {
            printf '## Published images\n\n'
            printf -- "- API: \`%s:%s\`\n" "${API_IMAGE_NAME}" "${GITHUB_SHA}"
            printf -- "  - Digest: \`%s\`\n" "${API_IMAGE_DIGEST}"
            printf -- "- Web: \`%s:%s\`\n" "${WEB_IMAGE_NAME}" "${GITHUB_SHA}"
            printf -- "  - Digest: \`%s\`\n" "${WEB_IMAGE_DIGEST}"
          } >>"${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy to home-mini
    if: github.ref == 'refs/heads/main'
    needs:
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: guess-pokemon-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          ping: home-mini

      - name: Configure restricted SSH identity
        env:
          HOME_MINI_SSH_KEY: ${{ secrets.HOME_MINI_SSH_KEY }}
          HOME_MINI_KNOWN_HOSTS: ${{ secrets.HOME_MINI_KNOWN_HOSTS }}
        run: |
          test -n "${HOME_MINI_SSH_KEY}"
          test -n "${HOME_MINI_KNOWN_HOSTS}"

          umask 077
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${HOME_MINI_SSH_KEY}" >"${HOME}/.ssh/id_ed25519_home_mini_ci"
          printf '%s\n' "${HOME_MINI_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"

          ssh-keygen -y -f "${HOME}/.ssh/id_ed25519_home_mini_ci" >/dev/null
          ssh-keygen -lf "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Deploy published images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" \
            | ssh \
                -F /dev/null \
                -i "${HOME}/.ssh/id_ed25519_home_mini_ci" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                homeserver@home-mini \
                "deploy-guess-pokemon ${GITHUB_SHA} ${GITHUB_ACTOR}"
