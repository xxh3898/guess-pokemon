name: Validate

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      infrastructure: ${{ steps.classify.outputs.infrastructure }}
      api_image: ${{ steps.classify.outputs.api_image }}
      web_image: ${{ steps.classify.outputs.web_image }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail

          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${PR_BASE_SHA}"
              ;;
            push)
              base_sha="${BEFORE_SHA}"
              ;;
            *)
              base_sha=""
              ;;
          esac

          if [[ -z "${base_sha}" \
            || "${base_sha}" =~ ^0{40}$ ]] \
            || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            ./scripts/classify-ci-paths.sh \
              ".github/workflows/validate.yml"
            exit 0
          fi

          mapfile -d '' -t changed_paths < <(
            git diff \
              --no-renames \
              --name-only \
              -z \
              "${base_sha}" \
              "${GITHUB_SHA}"
          )
          ./scripts/classify-ci-paths.sh "${changed_paths[@]}"

  infrastructure:
    name: Infrastructure checks
    needs:
      - changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Fail when change detection fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Skip unrelated infrastructure checks
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure != 'true'
        run: echo "No infrastructure-related changes."

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate shell scripts
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: |
          bash -n \
            scripts/backup-db.sh \
            scripts/backup-production-db-bootstrap.sh \
            scripts/backup-production-db.sh \
            scripts/deploy-guess-pokemon-ci.sh \
            scripts/deploy-guess-pokemon.sh \
            scripts/detect-runtime-config-change.sh \
            scripts/test-backup-production-db.sh \
            scripts/test-detect-runtime-config-change.sh \
            scripts/test-deploy-guess-pokemon.sh \
            scripts/test-runtime-script-bootstrap.sh \
            scripts/verify-compose.sh

      - name: Verify runtime config change detection
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: ./scripts/test-detect-runtime-config-change.sh

      - name: Test stable runtime script bootstraps
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: ./scripts/test-runtime-script-bootstrap.sh

      - name: Test deploy v2 state transitions
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: ./scripts/test-deploy-guess-pokemon.sh

      - name: Test production backup Compose selection
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: ./scripts/test-backup-production-db.sh

      - name: Render Compose variants
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: ENV_FILE=.env.example ./scripts/verify-compose.sh

      - name: Run infrastructure checks
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: |
          docker compose \
            --file compose.test.yaml \
            run --rm \
            infra-test
          docker compose \
            --file compose.test.yaml \
            run --rm \
            nginx-config-test

      - name: Build and verify runtime config image
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: |
          docker build \
            --file runtime-config.Dockerfile \
            --build-arg REVISION=1111111111111111111111111111111111111111 \
            --tag guess-pokemon-runtime-config:verify \
            .

          actual_revision="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              guess-pokemon-runtime-config:verify
          )"
          test "${actual_revision}" = 1111111111111111111111111111111111111111

          container_id="$(docker create guess-pokemon-runtime-config:verify)"
          runtime_dir="$(mktemp -d)"

          cleanup_runtime_config() {
            docker rm "${container_id}" >/dev/null 2>&1 || true
            rm -rf -- "${runtime_dir}"
          }
          trap cleanup_runtime_config EXIT INT TERM

          docker cp "${container_id}:/runtime/." "${runtime_dir}"
          expected_entries="$(
            printf '%s\n' \
              compose.yaml \
              infra \
              infra/nginx \
              infra/nginx/cloudflare-edge-real-ip.conf \
              scripts \
              scripts/backup-guess-pokemon.sh \
              scripts/deploy-guess-pokemon.sh
          )"
          actual_entries="$(
            find "${runtime_dir}" -mindepth 1 -printf '%P\n' \
              | LC_ALL=C sort
          )"
          test "${actual_entries}" = "${expected_entries}"
          for runtime_script in \
            "${runtime_dir}/scripts/backup-guess-pokemon.sh" \
            "${runtime_dir}/scripts/deploy-guess-pokemon.sh"
          do
            test -f "${runtime_script}"
            test ! -L "${runtime_script}"
            test "$(stat -c '%a' "${runtime_script}")" = 700
            bash -n "${runtime_script}"
          done

          cp .env.production.example "${runtime_dir}/.env"
          API_IMAGE=ghcr.io/xxh3898/guess-pokemon-api:1111111111111111111111111111111111111111 \
          WEB_IMAGE=ghcr.io/xxh3898/guess-pokemon-web:1111111111111111111111111111111111111111 \
            docker compose \
              --project-directory "${runtime_dir}" \
              --env-file "${runtime_dir}/.env" \
              --file "${runtime_dir}/compose.yaml" \
              config \
              --quiet

  frontend:
    name: Frontend checks
    needs:
      - changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Fail when change detection fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Skip unrelated frontend checks
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend != 'true'
        run: echo "No frontend-related changes."

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run frontend checks
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        run: >
          docker compose
          --file compose.test.yaml
          run --rm
          frontend-test

  backend:
    name: Backend checks
    needs:
      - changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Fail when change detection fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Skip unrelated backend checks
        if: needs.changes.result == 'success' && needs.changes.outputs.backend != 'true'
        run: echo "No backend-related changes."

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare Gradle user home
        if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
        run: mkdir -p "${RUNNER_TEMP}/gradle-user-home"

      - name: Restore Gradle dependency cache
        if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/gradle-user-home/caches
            ${{ runner.temp }}/gradle-user-home/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Run backend checks
        if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
        env:
          BACKEND_GRADLE_USER_HOME_VOLUME: ${{ runner.temp }}/gradle-user-home
        run: >
          docker compose
          --file compose.test.yaml
          run --rm
          backend-test

  api-image:
    name: API ARM64 image
    needs:
      - changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Fail when change detection fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Skip unrelated API image build
        if: needs.changes.result == 'success' && needs.changes.outputs.api_image != 'true'
        run: echo "No API image-related changes."

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.api_image == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        if: needs.changes.result == 'success' && needs.changes.outputs.api_image == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build API ARM64 verification image
        if: needs.changes.result == 'success' && needs.changes.outputs.api_image == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: false
          tags: guess-pokemon-api:verify
          cache-from: type=gha,scope=guess-pokemon-api-arm64
          cache-to: type=gha,mode=max,scope=guess-pokemon-api-arm64

  web-image:
    name: Web ARM64 image
    needs:
      - changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Fail when change detection fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Skip unrelated Web image build
        if: needs.changes.result == 'success' && needs.changes.outputs.web_image != 'true'
        run: echo "No Web image-related changes."

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.web_image == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        if: needs.changes.result == 'success' && needs.changes.outputs.web_image == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Web ARM64 verification image
        if: needs.changes.result == 'success' && needs.changes.outputs.web_image == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: false
          tags: guess-pokemon-web:verify
          cache-from: type=gha,scope=guess-pokemon-web-arm64
          cache-to: type=gha,mode=max,scope=guess-pokemon-web-arm64
