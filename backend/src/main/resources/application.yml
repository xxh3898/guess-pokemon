server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: Lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: guess-pokemon
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    jdbc:
      initialize-schema: never

pokemon:
  catalog:
    artwork-enabled: ${POKEMON_ARTWORK_ENABLED:true}
    snapshot-location: classpath:catalog/pokemon-species.json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
