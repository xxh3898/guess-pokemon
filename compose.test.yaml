name: guess-pokemon-test

services:
  frontend-test:
    image: node:24.18.0-alpine3.24
    working_dir: /workspace
    command: >
      sh -lc "npm ci --no-fund
      && npm run lint
      && npm run typecheck
      && npm test
      && npm run build
      && npm audit --audit-level=high"
    volumes:
      - ./frontend:/workspace:ro
      - frontend-test-dist:/workspace/dist
      - frontend-test-node-modules:/workspace/node_modules

  backend-test:
    image: gradle:9.5.1-jdk21-alpine
    user: root
    working_dir: ${PWD:?Run Docker Compose from the repository root}/backend
    command: ./gradlew test build --no-daemon
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: ${TESTCONTAINERS_HOST_OVERRIDE:-host.docker.internal}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: ${PWD:?Run Docker Compose from the repository root}/backend
        target: ${PWD:?Run Docker Compose from the repository root}/backend
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - backend-test-build:${PWD:?Run Docker Compose from the repository root}/backend/build
      - backend-test-gradle-cache:/home/gradle/.gradle
      - backend-test-project-cache:${PWD:?Run Docker Compose from the repository root}/backend/.gradle

  infra-test:
    image: node:24.18.0-alpine3.24
    working_dir: /workspace
    command: >
      node --test
      scripts/deploy-config.test.mjs
      scripts/nginx-config.test.mjs
      scripts/operations-config.test.mjs
    volumes:
      - ./.github:/workspace/.github:ro
      - ./.env.example:/workspace/.env.example:ro
      - ./.env.production.example:/workspace/.env.production.example:ro
      - ./README.md:/workspace/README.md:ro
      - ./compose.dev.yaml:/workspace/compose.dev.yaml:ro
      - ./compose.production.yaml:/workspace/compose.production.yaml:ro
      - ./compose.test.yaml:/workspace/compose.test.yaml:ro
      - ./compose.tunnel.yaml:/workspace/compose.tunnel.yaml:ro
      - ./compose.yaml:/workspace/compose.yaml:ro
      - ./docs:/workspace/docs:ro
      - ./frontend/Dockerfile:/workspace/frontend/Dockerfile:ro
      - ./infra:/workspace/infra:ro
      - ./scripts:/workspace/scripts:ro

  nginx-config-test:
    image: nginx:1.30.4-alpine3.24
    command: nginx -t
    extra_hosts:
      - api:127.0.0.1
    volumes:
      - ./infra/nginx/cloudflare-edge-real-ip.conf:/etc/nginx/conf.d/00-cloudflare-real-ip.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend-test-build:
  backend-test-gradle-cache:
  backend-test-project-cache:
  frontend-test-dist:
  frontend-test-node-modules:
