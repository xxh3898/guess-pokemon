map $realip_remote_addr $trusted_tunnel_request {
    172.18.0.2 1;
    172.30.77.3 1;
    172.30.77.4 1;
    default 0;
}

map "$trusted_tunnel_request:$http_x_forwarded_proto" $external_scheme {
    "1:http" http;
    "1:https" https;
    default $scheme;
}

map $http_host $external_host {
    "" $host;
    default $http_host;
}

map $http_host $explicit_external_port {
    ~:(?<request_host_port>[0-9]+)$ $request_host_port;
    default "";
}

map "$explicit_external_port:$external_scheme" $external_port {
    ~^(?<forwarded_host_port>[0-9]+): $forwarded_host_port;
    ":https" 443;
    default $server_port;
}

map $external_scheme $strict_transport_security {
    https "max-age=31536000";
    default "";
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    limit_req_status 429;
    limit_req_log_level warn;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: https://raw.githubusercontent.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $strict_transport_security always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /actuator/health/liveness {
        proxy_pass http://api:8080;
        proxy_set_header Host $external_host;
        proxy_set_header X-Forwarded-Host $external_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Port $external_port;
    }

    location = /actuator/health/readiness {
        proxy_pass http://api:8080;
        proxy_set_header Host $external_host;
        proxy_set_header X-Forwarded-Host $external_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Port $external_port;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location ~ ^/api/v1/auth/(?:login|signup)$ {
        limit_req zone=auth_per_ip burst=10 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $external_host;
        proxy_set_header X-Forwarded-Host $external_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Port $external_port;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $external_host;
        proxy_set_header X-Forwarded-Host $external_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Port $external_port;
    }

    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $external_host;
        proxy_set_header X-Forwarded-Host $external_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Port $external_port;
        proxy_read_timeout 70s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
